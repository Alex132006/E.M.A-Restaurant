<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Créez votre compte E.M.A Restaurant Bar.">
    <title>Inscription | E.M.A Restaurant Bar</title>

    <link rel="stylesheet" href="/front-end/css/connect/inscri.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>

    <main class="auth-container">

        <!-- Partie droite -->
        <section class="auth-form-container">

            <div class="form-wrapper">

                <div class="form-header">

                    <!-- <span class="small-title">REJOIGNEZ-NOUS</span> -->

                    <h2>Créer un compte</h2>

                    <p>
                        Inscrivez-vous pour profiter pleinement
                        de votre expérience E.M.A.
                    </p>

                </div>

                <form id="registerForm">

                    <div class="form-row">

                        <div class="input-group">
                            <label for="nom">Nom</label>
                            <input type="text" id="nom" name="nom" placeholder="Votre nom" required>
                        </div>

                        <div class="input-group">
                            <label for="prenom">Prénom</label>
                            <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required>
                        </div>

                    </div>

                    <div class="input-group">
                        <label for="telephone">Téléphone</label>

                        <input type="tel" id="telephone" name="telephone" placeholder="+242 06 000 00 00" required>
                    </div>


                    <div class="input-group">
                        <label for="email">Adresse e-mail</label>

                        <input type="email" id="email" name="email" placeholder="exemple@email.com" required>
                    </div>

                    <div class="input-group">

                        <label for="password">Mot de passe</label>

                        <div class="password-box">

                            <input type="password" id="password" name="password" placeholder="Minimum 8 caractères"
                                minlength="8" required>

                            <button type="button" class="toggle-password" data-target="password">
                                Afficher
                            </button>

                        </div>

                    </div>

                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirmer le mot de passe
                        </label>

                        <div class="password-box">

                            <input type="password" id="confirmPassword" name="confirmPassword"
                                placeholder="Répétez votre mot de passe" required>

                            <button type="button" class="toggle-password" data-target="confirmPassword">
                                Afficher
                            </button>

                        </div>

                    </div>

                    <div class="terms">

                        <input type="checkbox" id="conditions" required>

                        <label for="conditions">
                            J'accepte les
                            <a href="#">conditions générales</a>
                            et la politique de confidentialité.
                        </label>

                    </div>

                    <p id="message" class="message"></p>


                    <button type="submit" class="register-button">
                        CRÉER MON COMPTE
                    </button>

                </form>

                <div class="login-link">

                    Vous avez déjà un compte ?

                    <a href="/front-end/html/connexion/conexion.html" class="login-link-button">
                        Se connecter
                    </a>

                </div>

                <div class="secure-text">
                    E.M.A RESTAURANT BAR — BRAZZAVILLE
                </div>

            </div>

        </section>

    </main>

    <script src="/front-end/js/inscription/inscri.js"></script>

</body>

</html>
