<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connectez-vous à votre espace client E.M.A Restaurant Bar.">

    <title>Connexion | E.M.A Restaurant Bar</title>

    <link rel="stylesheet" href="/front-end/css/connexion/connexion.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>

    <main class="auth-container">

        <!-- SECTION CONNEXION -->
        <section class="auth-form-container">

            <div class="form-wrapper">

                <div class="form-header">

                    <span class="small-title">VOTRE ESPACE CLIENT</span>

                    <h2>Bienvenue !</h2>

                    <p>
                        Connectez-vous pour accéder à votre compte
                        et retrouver vos commandes.
                    </p>

                </div>


                <form id="loginForm">

                    <!-- EMAIL -->
                    <div class="input-group">

                        <label for="email">Adresse e-mail</label>

                        <input type="email" id="email" name="email" placeholder="exemple@email.com" autocomplete="email"
                            required>

                    </div>


                    <!-- MOT DE PASSE -->
                    <div class="input-group">

                        <label for="password">Mot de passe</label>

                        <div class="password-box">

                            <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe"
                                autocomplete="current-password" required>

                            <button type="button" class="toggle-password" id="togglePassword"
                                aria-label="Afficher le mot de passe">
                                Afficher
                            </button>

                        </div>

                    </div>


                    <!-- OPTIONS -->
                    <div class="form-options">

                        <label class="remember">

                            <input type="checkbox" id="remember">

                            <span>Se souvenir de moi</span>

                        </label>

                        <a href="/front-end/html/connect/mot-de-passe-oublie.html" class="forgot-password">
                            Mot de passe oublié ?
                        </a>

                    </div>


                    <!-- MESSAGE -->
                    <p id="message" class="message" aria-live="polite"></p>


                    <!-- BOUTON -->
                    <button type="submit" class="login-button">
                        SE CONNECTER
                    </button>

                </form>


                <!-- INSCRIPTION -->
                <div class="register-link">

                    Vous n'avez pas encore de compte ?

                    <a href="/front-end/html/connect/inscri.html" class="register-link-button">
                        Créer un compte
                    </a>

                </div>


                <div class="secure-text">
                    E.M.A RESTAURANT BAR — BRAZZAVILLE
                </div>

            </div>

        </section>

    </main>

    <script src="../../js/connexion/connexion.js"></script>

</body>

</html>
